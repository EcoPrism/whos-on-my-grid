[project]
name = "grid-api"
version = "0.1.0"
description = "Who's On My Grid: the brief service. One address in, one brief out."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "openai>=1.60",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1.4",
    "openpyxl>=3.1.5",
    "pyjwt[crypto]>=2.9",
    "azure-data-tables>=12.6",
    "azure-identity>=1.19",
    # The share card (app/card): 1200x630 PNG rendered in-process, no browser.
    "pillow>=10.0",
]

[dependency-groups]
# The offline indexers (app.perception, app.hearings): imagery, geometry, audio, SAM decoding.
# The API itself reads their JSON output and needs none of this.
index = [
    "meta-sam-parser>=0.1.0",
    "numpy>=2.0",
    "shapely>=2.0",
    "rasterio>=1.4",
    "imageio-ffmpeg>=0.5",
]
# C2PA content credentials on the share card (app/card/provenance.py::with_c2pa). Optional:
# without it, or without a signing cert, the card carries XMP only. The image installs it
# with `uv sync --group provenance` once a cert exists. The cap: 0.38.1 and later dropped
# the Windows wheels, and a universal lock must resolve on every platform.
provenance = [
    "c2pa-python>=0.37,<0.38.1",
]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Scripted fixtures and assertions read better on one line.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# `live` calls the real gateway and Baseten and costs tokens: deselected by
# default so `uv run pytest` stays offline. Run with `uv run pytest -m live --run-live`.
addopts = "-m 'not live'"
markers = ["live: calls the real LLM endpoints; needs --run-live and the GRID_* keys"]

[tool.uv]
package = false
